name: flashdial_web
description: "A smart web-based calling dashboard that lets you initiate and manage calls remotely through your connected Android device, with real-time call status and seamless call control"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  firebase_core: ^5.2.0
  firebase_auth: ^7.1.0
  firebase_database: ^13.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:

  uses-material-design: true
  assets:
    - assets/flashdial-mark.png
    - assets/flashdial-web-logo.png
